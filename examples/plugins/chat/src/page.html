<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话测试</title><style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0}main{padding:24px;max-width:1280px;margin:auto}h1{font-size:28px;margin:0 0 6px}p{line-height:1.6}.muted{color:#637087}.header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel{background:white;border-radius:16px;padding:20px;margin-top:20px;box-shadow:0 4px 20px #18365705}.fields{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr) auto;gap:14px;align-items:end}label{display:flex;flex-direction:column;gap:8px;font-weight:600}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid transparent;background:#f3f5f9;border-radius:8px;padding:11px;color:inherit}input:focus,textarea:focus{outline:2px solid #5576dc;outline-offset:2px}button{border:0;border-radius:8px;padding:10px 16px;background:#edf1f8;color:#243550;cursor:pointer;white-space:nowrap}button.primary{background:#4c6ed6;color:white}button.danger{background:#fff0ef;color:#a73232}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chat{min-height:200px;max-height:560px;overflow:auto;padding:4px 0;display:flex;flex-direction:column;gap:16px}.empty{margin:auto;text-align:center;padding:36px 12px;color:#69778f}.message{max-width:90%;padding:14px 16px;border-radius:12px;background:#f1f4fa;align-self:flex-start}.message.user{align-self:flex-end;background:#e9efff}.message strong{display:block;font-size:12px;margin-bottom:8px;color:#617091}.message pre{font:inherit;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.message.failed{background:#fff1ef}.compose{margin-top:20px}textarea{min-height:110px;resize:vertical}.foot{font-size:12px;color:#69778f}.status{min-height:22px;margin-top:12px;overflow-wrap:anywhere}.status.error{color:#b32f33}.chip{background:#edf2ff;border-radius:6px;padding:5px 8px;font-size:12px;color:#3453a1}summary{cursor:pointer}.advanced{max-width:300px;margin-top:12px}a{color:#4264cb}@media(max-width:680px){main{padding:12px}.panel{padding:16px}.fields{grid-template-columns:1fr}.message{max-width:100%}.header h1{font-size:24px}.toolbar button{flex:1}}
</style></head><body><main>
<div class="header"><div><h1>对话测试</h1><div class="muted">通过 RS 发起真实对话，检查模型、账号路由与请求扩展。</div></div><span class="chip">测试插件 · 0.1.0</span></div>
<section class="panel" aria-label="连接设置"><div class="fields"><label>RS API Key<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="填写 API 密钥页生成的 Key"></label><label>模型<input id="model" list="models" placeholder="加载列表或输入模型名称" maxlength="200"><datalist id="models"></datalist></label><button id="load">加载模型</button></div><p class="foot">API Key 仅用于当前页面请求，不保存到磁盘。对话会经过正常鉴权、路由和计量，可能产生模型用量。</p><details><summary class="muted">连接设置</summary><div class="advanced"><label>RS 内部服务端口<input id="port" type="number" min="1" max="65535" value="8080"></label><p class="foot">Docker 默认 8080。请求只发往运行插件的本机 RS。</p></div></details></section>
<section class="panel" aria-label="对话"><div class="row"><strong>测试会话</strong><button id="clear">新对话</button></div><div id="chat" class="chat" aria-live="polite"><div class="empty" id="empty">发送一条消息，查看模型回复。<br>先加载模型，也可以手动输入名称。</div></div><div id="form" class="compose"><label for="prompt">消息<textarea id="prompt" placeholder="例如：你好，请用一句话介绍自己。" maxlength="16000" required></textarea></label><div class="row" style="margin-top:12px"><span class="foot">Enter 发送 · Shift + Enter 换行</span><div class="toolbar"><button id="stop" type="button" class="danger" disabled>停止</button><button id="send" type="button" class="primary">发送消息</button></div></div></div><div id="status" role="status" class="status"></div><div id="details" class="foot"></div></section></main>
<script>
const $=id=>document.getElementById(id), awaiting=new Map();let seq=0,active='',working=false,history=[];
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='rs-plugin-result')return;const item=awaiting.get(event.data.id);if(!item)return;awaiting.delete(event.data.id);clearTimeout(item.timer);event.data.error?item.reject(Error('插件调用失败，请重试或检查运行状态。')):item.resolve(event.data.data)});
function call(method,input={}){return new Promise((resolve,reject)=>{const id=String(++seq);const timer=setTimeout(()=>{awaiting.delete(id);reject(Error('插件通信超时。'))},8000);awaiting.set(id,{resolve,reject,timer});parent.postMessage({type:'rs-plugin-call',id,method,input},'*')})}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function controls(busy){working=busy;for(const id of ['key','model','port','load','send','clear'])$(id).disabled=busy;$('stop').disabled=!busy}
function connection(){const key=$('key').value.trim(),port=Number($('port').value);if(!key)throw Error('请先填写 RS API Key。');if(!Number.isInteger(port)||port<1||port>65535)throw Error('请填写有效的服务端口。');return {apiKey:key,port}}
async function poll(id,update){for(let i=0;i<260;i++){const data=await call('admin.poll',{jobId:id});update?.(data);if(data.state!=='running')return data;await new Promise(resolve=>setTimeout(resolve,500))}await call('admin.cancel',{jobId:id});throw Error('请求超时，请检查 RS 日志。')}
function message(role,text){$('empty')?.remove();const el=document.createElement('article');el.className='message '+role;const name=document.createElement('strong');name.textContent=role==='user'?'你':'助手';const content=document.createElement('pre');content.textContent=text;el.append(name,content);$('chat').append(el);$('chat').scrollTop=$('chat').scrollHeight;return {el,content}}
function diagnostics(data){const parts=[];if(data.httpStatus)parts.push('HTTP '+data.httpStatus);if(data.elapsedMs!==undefined)parts.push((data.elapsedMs/1000).toFixed(2)+' 秒');const usage=data.usage;if(usage){if(usage.input_tokens!==undefined)parts.push('输入 '+usage.input_tokens+' tokens');if(usage.output_tokens!==undefined)parts.push('输出 '+usage.output_tokens+' tokens')}if(data.requestId)parts.push('请求 ID：'+data.requestId);$('details').textContent=parts.join(' · ')}
$('load').onclick=async()=>{try{const args=connection();controls(true);status('正在读取模型…');active=(await call('admin.start',{...args,kind:'models'})).jobId;const data=await poll(active);if(data.state!=='completed')throw Error(data.error||'已停止。');$('models').replaceChildren(...(data.models||[]).map(id=>{const option=document.createElement('option');option.value=id;return option}));if(!$('model').value&&data.models?.length)$('model').value=data.models[0];status(data.models?.length?'已加载 '+data.models.length+' 个模型。':'没有可用模型，请检查 Key 分组和账号配置。');diagnostics(data)}catch(e){status(e.message,true)}finally{active='';controls(false)}};
$('send').onclick=async()=>{if(working)return;let bubble;try{const args=connection(),model=$('model').value.trim(),text=$('prompt').value.trim();if(!model)throw Error('请选择或输入模型名称。');if(!text)return;if(history.length>=38)throw Error('此测试会话已达到上限，请开始新对话。');const messages=[...history,{role:'user',content:text}];controls(true);message('user',text);bubble=message('assistant','等待回复…');$('prompt').value='';$('details').textContent='';status('正在发送…');active=(await call('admin.start',{...args,kind:'chat',model,messages})).jobId;const data=await poll(active,state=>{if(state.text){bubble.content.textContent=state.text;$('chat').scrollTop=$('chat').scrollHeight}diagnostics(state)});if(data.state==='completed'){bubble.content.textContent=data.text||'（没有文本输出）';history=[...messages,{role:'assistant',content:data.text||'（没有文本输出）'}];status('回复完成。')}else{bubble.el.classList.add('failed');if(!data.text)bubble.content.textContent=data.state==='cancelled'?'已停止。':data.error||'请求失败。';status(data.error||'请求已停止。',data.state!=='cancelled')}}catch(e){if(bubble){bubble.el.classList.add('failed');bubble.content.textContent=e.message}status(e.message,true)}finally{active='';controls(false)}};
$('prompt').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('send').click()}});
$('stop').onclick=async()=>{if(!active)return;try{await call('admin.cancel',{jobId:active});status('正在停止…')}catch(e){status(e.message,true)}};
$('clear').onclick=()=>{history=[];$('chat').replaceChildren();const el=document.createElement('div');el.id='empty';el.className='empty';el.textContent='已开始新对话。';$('chat').append(el);$('details').textContent='';status('');$('prompt').focus()};
window.addEventListener('pagehide',()=>{if(active)call('admin.cancel',{jobId:active}).catch(()=>{})});
</script></body></html>
